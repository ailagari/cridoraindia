# Main web service (cridoraindia) — overrides dashboard if mis-set to a cron command.
# Cron backup service should use railway.cron.toml (set path in Railway service settings).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c \"python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py ensure_media_root && exec gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
